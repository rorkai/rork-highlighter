name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  macos:
    name: macOS
    runs-on: macos-15
    steps:
      - name: Check out the repository
        uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Validate the package
        env:
          BENCHMARK_DISABLE_JEMALLOC: "true"
        run: make check
      - name: Build for iOS
        run: >-
          xcodebuild
          -scheme rork-highlighter
          -destination 'generic/platform=iOS'
          -derivedDataPath "${RUNNER_TEMP}/rork-highlighter-ios"
          CODE_SIGNING_ALLOWED=NO
          build
          -quiet

  linux:
    name: Linux
    runs-on: ubuntu-24.04
    container: swift:6.0-noble
    steps:
      - name: Check out the repository
        uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Build and test
        run: swift test
      - name: Install benchmark prerequisites
        run: |
          apt-get update -q
          apt-get install -y -q libjemalloc-dev
      - name: Build measurement tools
        run: |
          swift build \
            --package-path Benchmarks \
            --scratch-path .build/benchmarks \
            --target RorkHighlighterBenchmarks \
            -Xswiftc -warnings-as-errors
          swift build \
            --package-path Tools/DistributionProbe \
            --scratch-path .build/distribution-probe \
            --target DistributionProbe \
            -Xswiftc -warnings-as-errors
