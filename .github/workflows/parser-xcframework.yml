name: Parser XCFramework

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/parser-xcframework.yml"
      - "LICENSE"
      - "LanguagePack.json"
      - "LanguagePack.lock.json"
      - "Makefile"
      - "Package.swift"
      - "Scripts/build_parser_xcframework.py"
      - "Scripts/tests/test_build_parser_xcframework.py"
      - "Scripts/vendor_languages.py"
      - "Sources/CRorkHighlighterParsers/**"
      - "THIRD_PARTY_NOTICES.md"
      - "ThirdPartyLicenses/**"

permissions:
  contents: read

concurrency:
  group: parser-xcframework-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Apple parser pack
    runs-on: macos-15
    steps:
      - name: Check out the repository
        # This commit is actions/checkout v5.1.0.
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - name: Build the complete parser XCFramework
        run: make parser-xcframework
      - name: Upload the parser pack
        # This commit is actions/upload-artifact v7.0.1.
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: CRorkHighlighterParsers
          if-no-files-found: error
          path: |
            .build/parser-pack/CRorkHighlighterParsers.artifact.json
            .build/parser-pack/CRorkHighlighterParsers.xcframework.zip
