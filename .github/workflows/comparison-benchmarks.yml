name: Comparison benchmarks

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: comparison-benchmarks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  macos:
    name: macOS comparison
    runs-on: macos-15
    steps:
      - name: Check out the repository
        uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: Benchmarks/Comparison/JavaScript/package-lock.json
      - name: Validate comparison tooling
        env:
          BENCHMARK_DISABLE_JEMALLOC: "true"
        run: make check-comparison
      - name: Run comparison benchmarks
        env:
          BENCHMARK_DISABLE_JEMALLOC: "true"
        run: >-
          make benchmark-comparison
          COMPARISON_BENCHMARK_ARGUMENTS="--metric wallClock --time-units microseconds --no-progress"
